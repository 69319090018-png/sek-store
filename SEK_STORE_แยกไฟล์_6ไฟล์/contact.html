<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEK STORE | ติดต่อ</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav"><div class="nav-in"><a class="brand" href="index.html">SEK STORE</a><nav class="nav-links"><a href="index.html">หน้าแรก</a><a href="products.html">สินค้า</a><a href="sell.html">ขายสินค้า</a><a href="branches.html">สาขา</a><a href="contact.html">ติดต่อสอบถาม</a></nav></div></header>
<main class="section"><div class="container"><div class="contact"><div class="kicker">CONTACT</div><h2>ติดต่อสอบถาม</h2><p class="desc">กรอกข้อมูลด้านล่างเพื่อส่งข้อความถึง SEK STORE</p><form class="form" onsubmit="send(event)"><input required placeholder="ชื่อของคุณ"><input required type="email" placeholder="อีเมล"><select><option>สอบถามสินค้า</option><option>ขายสินค้า</option><option>สอบถามสาขา</option><option>อื่นๆ</option></select><textarea required rows="6" placeholder="รายละเอียดที่ต้องการสอบถาม"></textarea><button class="btn btn-main" type="submit">ส่งข้อความ</button></form></div></div></main>
<div class="modal" id="modal"><div class="modal-box"><button class="close" onclick="hide()">×</button><div class="kicker">SUCCESS</div><h2>ส่งข้อความเรียบร้อย</h2><p>ขอบคุณที่ติดต่อ SEK STORE</p><a class="btn btn-main" href="index.html">กลับหน้าแรก</a></div></div>
<script>function send(e){e.preventDefault();modal.classList.add('show');e.target.reset()}function hide(){modal.classList.remove('show')}</script>
